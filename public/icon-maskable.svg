<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B5D1B5"/>
      <stop offset="100%" style="stop-color:#8FB88F"/>
    </linearGradient>
  </defs>

  <!-- Full background for maskable icon (no rounded corners - OS applies mask) -->
  <rect width="512" height="512" fill="url(#bgGradient)"/>

  <!-- Two overlapping hearts - scaled down for safe zone (80% of icon area) -->
  <g transform="translate(256, 276)">
    <!-- Left heart (white/cream) -->
    <path d="M-60 -40
             C-60 -72, -28 -84, 0 -56
             C28 -84, 60 -72, 60 -40
             C60 8, 0 60, 0 60
             C0 60, -60 8, -60 -40
             Z"
          fill="#FFFBF5"
          transform="translate(-36, -8) rotate(-12) scale(1.05)"
          opacity="0.95"/>

    <!-- Right heart (rose pink) - overlapping -->
    <path d="M-60 -40
             C-60 -72, -28 -84, 0 -56
             C28 -84, 60 -72, 60 -40
             C60 8, 0 60, 0 60
             C0 60, -60 8, -60 -40
             Z"
          fill="#D4A5A5"
          transform="translate(36, -8) rotate(12) scale(1.05)"
          opacity="0.9"/>
  </g>

  <!-- Small sparkle accent -->
  <circle cx="340" cy="170" r="10" fill="rgba(255,255,255,0.5)"/>
  <circle cx="355" cy="155" r="5" fill="rgba(255,255,255,0.35)"/>
</svg>
