# GitHub Actions workflow for Amika iOS App
# Builds, tests, and deploys to TestFlight

name: iOS Build & Deploy

on:
  push:
    branches:
      - main
      - 'release/*'
    paths:
      - 'ios/**'
      - '.github/workflows/ios-deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ios/**'
  workflow_dispatch:
    inputs:
      deploy_to_testflight:
        description: 'Deploy to TestFlight'
        required: false
        default: false
        type: boolean
      bump_version:
        description: 'Bump version (major/minor/patch)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - patch
          - minor
          - major

env:
  XCODE_VERSION: '15.0'
  RUBY_VERSION: '3.2'

jobs:
  # ==================== Build & Test ====================
  build-and-test:
    name: Build & Test
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ios

      - name: Install Fastlane
        working-directory: ios
        run: bundle install

      - name: Build app
        working-directory: ios
        run: bundle exec fastlane build

      - name: Run tests
        working-directory: ios
        run: bundle exec fastlane test
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ios/test_output/
          retention-days: 7

  # ==================== Deploy to TestFlight ====================
  deploy-testflight:
    name: Deploy to TestFlight
    runs-on: macos-14
    timeout-minutes: 45
    needs: build-and-test
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_to_testflight == 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ios

      - name: Install Fastlane
        working-directory: ios
        run: bundle install

      # Set up keychain for code signing
      - name: Create keychain
        run: |
          security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

      # Import certificates using match
      - name: Sync certificates
        working-directory: ios
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_KEYCHAIN_NAME: build.keychain
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: bundle exec fastlane sync_certificates

      # Optional: Bump version
      - name: Bump version
        if: github.event.inputs.bump_version != ''
        working-directory: ios
        run: bundle exec fastlane bump_version type:${{ github.event.inputs.bump_version }}

      # Build and upload to TestFlight
      - name: Build and upload to TestFlight
        working-directory: ios
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: bundle exec fastlane beta

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: amika-ipa
          path: ios/build/Amika.ipa
          retention-days: 30

      # Clean up keychain
      - name: Delete keychain
        if: always()
        run: security delete-keychain build.keychain || true

  # ==================== Notify on completion ====================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [build-and-test, deploy-testflight]
    if: always()

    steps:
      - name: Check build status
        run: |
          if [[ "${{ needs.build-and-test.result }}" == "failure" ]]; then
            echo "Build failed!"
            exit 1
          fi

          if [[ "${{ needs.deploy-testflight.result }}" == "failure" ]]; then
            echo "TestFlight deployment failed!"
            exit 1
          fi

          echo "All jobs completed successfully!"

      # Optional: Add Slack/Discord notification here
      # - name: Send Slack notification
      #   uses: slackapi/slack-github-action@v1
      #   with:
      #     channel-id: 'C01234567'
      #     slack-message: 'iOS build deployed to TestFlight!'
      #   env:
      #     SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
