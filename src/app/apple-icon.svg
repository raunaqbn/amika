<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B5D1B5"/>
      <stop offset="100%" style="stop-color:#8FB88F"/>
    </linearGradient>
  </defs>

  <!-- Background (Apple adds its own rounding) -->
  <rect width="180" height="180" fill="url(#bgGradient)"/>

  <!-- Two overlapping hearts representing friendship & connection -->
  <g transform="translate(90, 100)">
    <!-- Left heart (white/cream) -->
    <path d="M-60 -40
             C-60 -72, -28 -84, 0 -56
             C28 -84, 60 -72, 60 -40
             C60 8, 0 60, 0 60
             C0 60, -60 8, -60 -40
             Z"
          fill="#FFFBF5"
          transform="translate(-16, -4) rotate(-12) scale(0.45)"
          opacity="0.95"/>

    <!-- Right heart (rose pink) - overlapping -->
    <path d="M-60 -40
             C-60 -72, -28 -84, 0 -56
             C28 -84, 60 -72, 60 -40
             C60 8, 0 60, 0 60
             C0 60, -60 8, -60 -40
             Z"
          fill="#D4A5A5"
          transform="translate(16, -4) rotate(12) scale(0.45)"
          opacity="0.9"/>
  </g>

  <!-- Small sparkle accent -->
  <circle cx="134" cy="48" r="4" fill="rgba(255,255,255,0.6)"/>
  <circle cx="142" cy="40" r="2" fill="rgba(255,255,255,0.4)"/>
</svg>
